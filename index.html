<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓国語単語・発音チェック</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="韓国語発音">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 5px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #70a1ff;
      background-color: white;
      color: #70a1ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background-color: #70a1ff;
      color: white;
    }
    .weak-toggle-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #ff6b81;
      background-color: white;
      color: #ff6b81;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .weak-toggle-btn.active {
      background-color: #ff6b81;
      color: white;
    }
    .korean-word {
      font-size: 38px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
      min-height: 48px;
      word-break: keep-all;
    }
    .japanese-meaning {
      font-size: 18px;
      color: #7f8c8d;
      margin-bottom: 10px;
      min-height: 25px;
    }
    .word-stats {
      font-size: 13px;
      color: #555;
      background: #f1f2f6;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin: 8px 0;
    }
    .btn-group .btn {
      margin: 0;
      flex: 1;
    }
    .btn-remember {
      background-color: #2ed573;
      color: white;
    }
    .btn-forgot {
      background-color: #ff4757;
      color: white;
    }
    .btn-answer {
      background-color: #ffa502;
      color: white;
    }
    .btn-audio {
      background-color: #70a1ff;
      color: white;
    }
    .btn-mic {
      background-color: #5352ed;
      color: white;
    }
    .btn-next {
      background-color: #2f3542;
      color: white;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 15px;
      min-height: 50px;
      line-height: 1.4;
    }
    .result-correct {
      color: #2ed573;
      font-weight: bold;
      font-size: 19px;
    }
    .result-wrong {
      color: #ff4757;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- モード切り替え -->
  <div class="mode-selector">
    <button class="mode-btn active" id="mode1Btn">モード①<br>(日本語➔韓国語)</button>
    <button class="mode-btn" id="mode2Btn">モード②<br>(韓国語➔日本語)</button>
  </div>

  <!-- 苦手集中出題トグル -->
  <button class="weak-toggle-btn" id="weakToggleBtn">🔥 苦手集中モード: OFF</button>

  <div class="korean-word" id="wordDisplay">---</div>
  <div class="japanese-meaning" id="meaningDisplay">---</div>
  <div class="word-stats" id="statsDisplayDetail">📊 成績: 未挑戦</div>

  <!-- 答えを見るボタン -->
  <button class="btn btn-answer" id="answerBtn">💡 答えを見る</button>

  <!-- 答えを見た後に表示される自己判定ボタン -->
  <div class="btn-group" id="selfAssessGroup" style="display: none;">
    <button class="btn btn-remember" id="rememberBtn">⭕ 覚えていた</button>
    <button class="btn btn-forgot" id="forgotBtn">❌ 覚えていなかった</button>
  </div>

  <button class="btn btn-audio" id="audioBtn">🔊 お手本を聞く</button>
  <button class="btn btn-mic" id="micBtn">🎤 発音して判定</button>
  <button class="btn btn-next" id="nextBtn">次へ ➔</button>

  <div class="status" id="statusDisplay">「答えを見る」か「発音して判定」を押してください</div>
</div>

<script>
// 単語データ
const words = [
  { kr: "계시다", jp: "いらっしゃる" },
  { kr: "계절", jp: "季節" },
  { kr: "계획", jp: "計画" },
  { kr: "고기", jp: "肉" },
  { kr: "고등학교", jp: "高等学校" },
  { kr: "고등학생", jp: "高校生" },
  { kr: "고르다", jp: "選ぶ" },
  { kr: "고마웠습니다", jp: "ありがとうございました" },
  { kr: "고맙다", jp: "ありがたい" },
  { kr: "고맙습니다", jp: "ありがとうございます" },
  { kr: "고모", jp: "（父方の）おば" },
  { kr: "고모부", jp: "（父方の）おばの夫、おじ" },
  { kr: "고속버스", jp: "高速バス" },
  { kr: "고양이", jp: "猫" },
  { kr: "고장", jp: "故障" },
  { kr: "고추", jp: "唐辛子" },
  { kr: "고추장", jp: "コチュジャン" },
  { kr: "고치다", jp: "なおす" },
  { kr: "고프다", jp: "（お腹が）すいている、空腹だ" },
  { kr: "고향", jp: "故郷、ふるさと" },
  { kr: "곧", jp: "すぐ" },
  { kr: "골목", jp: "路地、裏通り" },
  { kr: "골프", jp: "ゴルフ" },
  { kr: "곱다", jp: "美しい" },
  { kr: "곳", jp: "ところ" },
  { kr: "공", jp: "ボール、玉" },
  { kr: "공간", jp: "空間" },
  { kr: "공기", jp: "空気" },
  { kr: "공무원", jp: "公務員" },
  { kr: "공부", jp: "勉強" },
  { kr: "공부하다", jp: "勉強する" },
  { kr: "공연", jp: "公演" },
  { kr: "공원", jp: "公園" },
  { kr: "공중전화", jp: "公衆電話" },
  { kr: "공짜", jp: "ただ、無料" },
  { kr: "공책", jp: "ノート" },
  { kr: "공항", jp: "空港" },
  { kr: "공휴일", jp: "祝日" },
  { kr: "과", jp: "課" },
  { kr: "과거", jp: "過去" },
  { kr: "과일", jp: "果物" },
  { kr: "과자", jp: "菓子" },
  { kr: "과학", jp: "科学" },
  { kr: "관계", jp: "関係" },
  { kr: "관광하다", jp: "観光する" },
  { kr: "관심", jp: "関心、興味" },
  { kr: "광고", jp: "広告" },
  { kr: "괜찮다", jp: "大丈夫だ、構わない" },
  { kr: "괜찮습니다", jp: "大丈夫です、結構です" },
  { kr: "교과서", jp: "教科書" },
  { kr: "교수", jp: "教授" },
  { kr: "교실", jp: "教室" },
  { kr: "교체", jp: "交代" },
  { kr: "교통", jp: "交通" },
  { kr: "교통사고", jp: "交通事故" },
  { kr: "교회", jp: "教会" },
  { kr: "구", jp: "9" },
  { kr: "구경하다", jp: "見物する" },
  { kr: "구두", jp: "靴" },
  { kr: "구름", jp: "雲" },
  { kr: "구십", jp: "90" },
  { kr: "구월", jp: "９月" },
  { kr: "구하다", jp: "求める、手に入れる" },
  { kr: "국", jp: "スープ、汁" },
  { kr: "국내", jp: "国内" },
  { kr: "국립", jp: "国立" },
  { kr: "국수", jp: "麺、麺類" },
  { kr: "국어", jp: "国語" },
  { kr: "국적", jp: "国籍" },
  { kr: "국제", jp: "国際" },
  { kr: "군인", jp: "軍人" },
  { kr: "굽다", jp: "焼く" },
  { kr: "권", jp: "～巻" },
  { kr: "귀", jp: "耳" },
  { kr: "귀엽다", jp: "かわいい" },
  { kr: "규칙", jp: "規則" },
  { kr: "귤", jp: "みかん" },
  { kr: "그", jp: "その" },
  { kr: "그거", jp: "それ" },
  { kr: "그것", jp: "それ" },
  { kr: "그곳", jp: "そこ" },
  { kr: "그날", jp: "その日" },
  { kr: "그냥", jp: "そのまま、ただ" },
  { kr: "그동안", jp: "その間、これまで" },
  { kr: "그들", jp: "彼ら" },
  { kr: "그때", jp: "そのとき、当時" },
  { kr: "그래", jp: "うん、そう（相づち）" },
  { kr: "그래서", jp: "それで、そうして" },
  { kr: "그램", jp: "グラム" },
  { kr: "그러나", jp: "しかし、けれど" },
  { kr: "그러니까", jp: "だから、そうだから" },
  { kr: "그러면", jp: "そうなら、それでは" },
  { kr: "그런", jp: "そんな" },
  { kr: "그런데", jp: "ところで、ところが" },
  { kr: "그럼", jp: "では" },
  { kr: "그렇게", jp: "そのように" },
  { kr: "그렇구나", jp: "なるほど、そうなんだ" },
  { kr: "그렇다", jp: "そうだ" },
  { kr: "그렇습니다", jp: "そうです" },
  { kr: "그렇지만", jp: "そうだけれど、しかし" }
];

let currentIndex = 0;
let currentMode = 1; // 1: 日本語➔韓国語, 2: 韓国語➔日本語
let isWeakOnly = false;
let recognition = null;

// 成績データの読み込み・保存 (localStorage)
function loadStats() {
  const saved = localStorage.getItem('korean_word_stats');
  return saved ? JSON.parse(saved) : {};
}

function saveStats(stats) {
  localStorage.setItem('korean_word_stats', JSON.stringify(stats));
}

let wordStats = loadStats();

const wordDisplay = document.getElementById('wordDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const statsDisplayDetail = document.getElementById('statsDisplayDetail');
const mode1Btn = document.getElementById('mode1Btn');
const mode2Btn = document.getElementById('mode2Btn');
const weakToggleBtn = document.getElementById('weakToggleBtn');
const answerBtn = document.getElementById('answerBtn');
const selfAssessGroup = document.getElementById('selfAssessGroup');
const rememberBtn = document.getElementById('rememberBtn');
const forgotBtn = document.getElementById('forgotBtn');
const audioBtn = document.getElementById('audioBtn');
const micBtn = document.getElementById('micBtn');
const nextBtn = document.getElementById('nextBtn');
const statusDisplay = document.getElementById('statusDisplay');

// 音声再生機能
function playKoreanAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("お使いのブラウザは音声読み上げに対応していません。");
  }
}

// 音声認識の初期化
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusDisplay.textContent = "お使いのブラウザは音声認識に対応していません。(iOS 14.5以降のSafariをご使用ください)";
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusDisplay.textContent = "🎙️ 聞き取り中... 発音してください";
    micBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    const recognizedText = event.results.transcript.trim();
    judgePronunciation(recognizedText);
  };

  recognition.onerror = () => {
    statusDisplay.textContent = "❌ 認識エラーが発生しました。もう一度お試しください。";
    micBtn.disabled = false;
  };

  recognition.onend = () => {
    micBtn.disabled = false;
  };
}

// 成績表示更新
function updateWordStatsDisplay(wordKr) {
  const stat = wordStats[wordKr] || { attempts: 0, corrects: 0 };
  if (stat.attempts === 0) {
    statsDisplayDetail.textContent = "📊 成績: 未挑戦";
  } else {
    const rate = Math.round((stat.corrects / stat.attempts) * 100);
    statsDisplayDetail.textContent = `📊 成績: 正解率 ${rate}% (${stat.corrects}/${stat.attempts}回)`;
  }
}

// 単語表示の更新（出題時の初期化）
function showWord(index) {
  const word = words[index];

  if (currentMode === 1) {
    wordDisplay.textContent = "❓❓❓";
    meaningDisplay.textContent = word.jp;
  } else {
    wordDisplay.textContent = word.kr;
    meaningDisplay.textContent = "❓❓❓";
  }

  // ボタン表示状態のリセット
  answerBtn.style.display = 'block';
  selfAssessGroup.style.display = 'none';

  updateWordStatsDisplay(word.kr);
  statusDisplay.innerHTML = "「答えを見る」か「発音して判定」を押してください";
}

// 次の単語インデックスをランダム選出
function selectNextIndex() {
  if (!isWeakOnly) {
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const weakIndices = words.map((w, idx) => {
    const stat = wordStats[w.kr] || { attempts: 0, corrects: 0 };
    const rate = stat.attempts > 0 ? (stat.corrects / stat.attempts) * 100 : 0;
    return { idx, rate, attempts: stat.attempts };
  }).filter(item => item.attempts === 0 || item.rate < 80);

  if (weakIndices.length === 0) {
    statusDisplay.innerHTML = "🎉 すべての苦手単語を克服しました！";
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const candidates = weakIndices.filter(item => item.idx !== currentIndex);
  const targetList = candidates.length > 0 ? candidates : weakIndices;
  const randomChoice = targetList[Math.floor(Math.random() * targetList.length)];
  return randomChoice.idx;
}

// 「答えを見る」処理
answerBtn.addEventListener('click', () => {
  const currentWord = words[currentIndex];
  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'flex';
  statusDisplay.innerHTML = "覚えていましたか？ボタンを押して選択してください";
});

// 自己判定処理（覚えていた / 覚えていなかった）➔ 成績記録後にすぐ次の出題へ
function recordSelfAssessment(isCorrect) {
  const currentWord = words[currentIndex];

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (isCorrect) {
    wordStats[currentWord.kr].corrects += 1;
  }

  saveStats(wordStats);

  // 即座に次の単語へ移動
  currentIndex = selectNextIndex();
  showWord(currentIndex);
}

// 音声判定処理
function judgePronunciation(userInput) {
  const currentWord = words[currentIndex];
  const targetWord = currentWord.kr.replace(/\s+/g, '');
  const cleanInput = userInput.replace(/\s+/g, '');

  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'none';

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (cleanInput === targetWord) {
    wordStats[currentWord.kr].corrects += 1;
    statusDisplay.innerHTML = `<span class="result-correct">⭕ 発音成功！</span><br>（認識結果: ${userInput}）`;
  } else {
    statusDisplay.innerHTML = `<span class="result-wrong">❌ 惜しい！</span><br>（認識結果: ${userInput}）`;
  }

  saveStats(wordStats);
  updateWordStatsDisplay(currentWord.kr);
}

// イベント設定
rememberBtn.addEventListener('click', () => recordSelfAssessment(true));
forgotBtn.addEventListener('click', () => recordSelfAssessment(false));

mode1Btn.addEventListener('click', () => {
  if (currentMode !== 1) {
    currentMode = 1;
    mode1Btn.classList.add('active');
    mode2Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

mode2Btn.addEventListener('click', () => {
  if (currentMode !== 2) {
    currentMode = 2;
    mode2Btn.classList.add('active');
    mode1Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

weakToggleBtn.addEventListener('click', () => {
  isWeakOnly = !isWeakOnly;
  if (isWeakOnly) {
    weakToggleBtn.textContent = "🔥 苦手集中モード: ON";
    weakToggleBtn.classList.add('active');
  } else {
    weakToggleBtn.textContent = "🔥 苦手集中モード: OFF";
    weakToggleBtn.classList.remove('active');
  }
});

audioBtn.addEventListener('click', () => {
  playKoreanAudio(words[currentIndex].kr);
});

micBtn.addEventListener('click', () => {
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
      recognition.start();
    }
  }
});

nextBtn.addEventListener('click', () => {
  currentIndex = selectNextIndex();
  showWord(currentIndex);
});

// 初期描画
currentIndex = Math.floor(Math.random() * words.length);
showWord(currentIndex);

// Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
}
</script>
</body>
</html>
