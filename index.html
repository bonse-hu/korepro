<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓国語単語・発音チェック</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="韓国語発音">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #70a1ff;
      background-color: white;
      color: #70a1ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background-color: #70a1ff;
      color: white;
    }
    .korean-word {
      font-size: 40px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 8px;
      min-height: 50px;
      word-break: keep-all;
    }
    .japanese-meaning {
      font-size: 18px;
      color: #7f8c8d;
      margin-bottom: 25px;
      min-height: 27px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-answer {
      background-color: #ffa502;
      color: white;
    }
    .btn-audio {
      background-color: #70a1ff;
      color: white;
    }
    .btn-mic {
      background-color: #ff4757;
      color: white;
    }
    .btn-next {
      background-color: #2ed573;
      color: white;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      font-size: 16px;
      min-height: 60px;
      line-height: 1.5;
    }
    .result-correct {
      color: #2ed573;
      font-weight: bold;
      font-size: 22px;
    }
    .result-wrong {
      color: #ff4757;
      font-weight: bold;
      font-size: 22px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- モード切り替え -->
  <div class="mode-selector">
    <button class="mode-btn active" id="mode1Btn">モード①<br>(日本語 ➔ 韓国語)</button>
    <button class="mode-btn" id="mode2Btn">モード②<br>(韓国語 ➔ 日本語)</button>
  </div>

  <div class="korean-word" id="wordDisplay">---</div>
  <div class="japanese-meaning" id="meaningDisplay">---</div>

  <button class="btn btn-answer" id="answerBtn">💡 答えを見る</button>
  <button class="btn btn-audio" id="audioBtn">🔊 お手本を聞く</button>
  <button class="btn btn-mic" id="micBtn">🎤 発音する</button>
  <button class="btn btn-next" id="nextBtn">次へ ➔</button>

  <div class="status" id="statusDisplay">「発音する」を押して話してください</div>
</div>

<script>
// 単語データ
const words = [
  { kr: "안녕하세요", jp: "こんにちは" },
  { kr: "감사합니다", jp: "ありがとうございます" },
  { kr: "맛있어요", jp: "美味しいです" },
  { kr: "고마워요", jp: "ありがとう" },
  { kr: "네", jp: "はい" },
  { kr: "아니요", jp: "いいえ" },
  { kr: "사랑해요", jp: "愛しています" },
  { kr: "죄송합니다", jp: "すみません" }
];

let currentIndex = 0;
let currentMode = 1; // 1: 日本語表示 ➔ 韓国語隠し / 2: 韓国語表示 ➔ 日本語隠し
let recognition = null;

const wordDisplay = document.getElementById('wordDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const mode1Btn = document.getElementById('mode1Btn');
const mode2Btn = document.getElementById('mode2Btn');
const answerBtn = document.getElementById('answerBtn');
const audioBtn = document.getElementById('audioBtn');
const micBtn = document.getElementById('micBtn');
const nextBtn = document.getElementById('nextBtn');
const statusDisplay = document.getElementById('statusDisplay');

// 1. 音声再生機能
function playKoreanAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("お使いのブラウザは音声読み上げに対応していません。");
  }
}

// 2. 音声認識機能
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusDisplay.textContent = "お使いのブラウザは音声認識に対応していません。(iOS 14.5以降のSafariをご使用ください)";
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusDisplay.textContent = "🎙️ 聞き取り中... 発音してください";
    micBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    const recognizedText = event.results.transcript.trim();
    judgePronunciation(recognizedText);
  };

  recognition.onerror = (event) => {
    statusDisplay.textContent = "❌ 認識エラーが発生しました。もう一度お試しください。";
    micBtn.disabled = false;
  };

  recognition.onend = () => {
    micBtn.disabled = false;
  };
}

// 単語表示の更新
function showWord(index) {
  const word = words[index];

  if (currentMode === 1) {
    wordDisplay.textContent = "❓❓❓";
    meaningDisplay.textContent = word.jp;
  } else {
    wordDisplay.textContent = word.kr;
    meaningDisplay.textContent = "❓❓❓";
  }
  statusDisplay.innerHTML = "「発音する」を押して話してください";
}

// 発音判定処理
function judgePronunciation(userInput) {
  const currentWord = words[currentIndex];
  const targetWord = currentWord.kr.replace(/\s+/g, '');
  const cleanInput = userInput.replace(/\s+/g, '');

  // 判定時は隠されていた部分を表示
  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  if (cleanInput === targetWord) {
    statusDisplay.innerHTML = `<span class="result-correct">⭕ 正解！</span><br>（認識結果: ${userInput}）`;
  } else {
    statusDisplay.innerHTML = `<span class="result-wrong">❌ 惜しい！</span><br>（認識結果: ${userInput}）`;
  }
}

// ボタンイベント設定

// 💡 答えを見るボタンの処理
answerBtn.addEventListener('click', () => {
  const currentWord = words[currentIndex];
  if (currentMode === 1) {
    // モード①: 隠れている韓国語を表示
    wordDisplay.textContent = currentWord.kr;
  } else {
    // モード②: 隠れている日本語を表示
    meaningDisplay.textContent = currentWord.jp;
  }
});

mode1Btn.addEventListener('click', () => {
  if (currentMode !== 1) {
    currentMode = 1;
    mode1Btn.classList.add('active');
    mode2Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

mode2Btn.addEventListener('click', () => {
  if (currentMode !== 2) {
    currentMode = 2;
    mode1Btn.classList.add('active');
    mode1Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

audioBtn.addEventListener('click', () => {
  playKoreanAudio(words[currentIndex].kr);
});

micBtn.addEventListener('click', () => {
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
      recognition.start();
    }
  }
});

nextBtn.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % words.length;
  showWord(currentIndex);
});

// 初期描画
showWord(currentIndex);

// Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
}
</script>
</body>
</html>
