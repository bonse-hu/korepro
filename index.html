    }

      background: white;

    }

      padding: 8px 5px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #70a1ff;
      background-color: white;
      color: #70a1ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;

    .mode-btn.active {
      background-color: #70a1ff;
      color: white;
    }
    .weak-toggle-btn {

      font-size: 14px;
      font-weight: bold;
      border: 2px solid #ff6b81;
      background-color: white;
      color: #ff6b81;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .weak-toggle-btn.active {
      background-color: #ff6b81;
      color: white;
    }

      font-size: 38px;
      font-weight: bold;
      color: #2c3e50;

      word-break: keep-all;
    }
    .japanese-meaning {
      font-size: 18px;

      margin-bottom: 10px;
      min-height: 25px;
    }
    .word-stats {
      font-size: 13px;
      color: #555;
      background: #f1f2f6;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin: 8px 0;
    }
    .btn-group .btn {
      margin: 0;
      flex: 1;
    }
    .btn-remember { background-color: #2ed573; color: white; }
    .btn-forgot   { background-color: #ff4757; color: white; }
    .btn-answer   { background-color: #ffa502; color: white; }

    .btn-next     { background-color: #2f3542; color: white; }
    .btn-listen   { background-color: #8e44ad; color: white; }

      background-color: #ccc;

    }

      font-size: 15px;
      min-height: 50px;
      line-height: 1.4;

      color: #555;

      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;

let currentIndex = 0;
let currentMode = 1; // 1: 日本語➔韓国語, 2: 韓国語➔日本語

let recognition = null;

// 聞き流しモード用の状態
let isListening = false;
let listenTimer = null;
let loopId = 0;              // 読み上げの世代管理（スキップ時に古いコールバックを無効化）
let currentUtterance = null; // GC対策で参照を保持
let wakeLock = null;
let toastTimer = null;

// 聞き流しモードの間隔設定（ミリ秒）
const PAUSE_AFTER_KOREAN = 1500;   // 韓国語のあと日本語までの間
const PAUSE_AFTER_JAPANESE = 2000; // 日本語のあと次の単語までの間

// ===== 保存データ (localStorage) =====
function loadStats() {
  const saved = localStorage.getItem('korean_word_stats');
  return saved ? JSON.parse(saved) : {};
}
function saveStats(stats) {
  localStorage.setItem('korean_word_stats', JSON.stringify(stats));
}

// 覚えた単語（聞き流しモードで出題しない単語）
function loadMastered() {
  const saved = localStorage.getItem('korean_mastered_words');
  return new Set(saved ? JSON.parse(saved) : []);
}
function saveMastered() {
  localStorage.setItem('korean_mastered_words', JSON.stringify([...masteredSet]));
}

let wordStats = loadStats();
let masteredSet = loadMastered();

// 覚えた単語数の表示更新
function updateMasteredDisplay() {
  // 単語リストに存在しないものは数えない
  const count = words.filter(w => masteredSet.has(w.kr)).length;
  masteredCountDisplay.textContent = `✅ 覚えた単語: ${count}語 / ${words.length}語`;
  listenInfo.textContent = `残り ${words.length - count}語`;
}

// ===== 音声 =====
function findVoice(lang) {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const prefix = lang.split('-')[0];
  return voices.find(v => v.lang === lang) ||
         voices.find(v => v.lang && v.lang.startsWith(prefix)) ||
         null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function playKoreanAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.8;
    const voice = findVoice('ko-KR');
    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("お使いのブラウザは音声読み上げに対応していません。");
  }
}

function speakWithCallback(text, lang, rate, onEnd) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = rate;
  const voice = findVoice(lang);
  if (voice) utterance.voice = voice;

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    if (onEnd) onEnd();
  };
  utterance.onend = finish;
  utterance.onerror = finish;

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

// ===== 聞き流しモード =====

// 聞き流し用の出題選択（覚えた単語を除外）
function selectListenIndex() {
  let pool = words
    .map((w, idx) => ({ w, idx }))
    .filter(item => !masteredSet.has(item.w.kr));

  // 苦手集中モードONなら、苦手単語に絞る（該当なしなら絞らない）
  if (isWeakOnly) {
    const weakPool = pool.filter(item => {
      const stat = wordStats[item.w.kr] || { attempts: 0, corrects: 0 };
      if (stat.attempts === 0) return true;
      return (stat.corrects / stat.attempts) * 100 < 80;
    });
    if (weakPool.length > 0) pool = weakPool;
  }

  // 直前と同じ単語を避ける（候補が1つしかない場合は除く）
  const candidates = pool.filter(item => item.idx !== currentIndex);
  const target = candidates.length > 0 ? candidates : pool;
  return target[Math.floor(Math.random() * target.length)].idx;
}

// 全単語を覚えたらリセット（リセットした場合はtrueを返す）
function resetIfAllMastered() {
  const allMastered = words.every(w => masteredSet.has(w.kr));
  if (allMastered) {
    masteredSet.clear();
    saveMastered();
    updateMasteredDisplay();
    return true;
  }
  return false;
}

function showToast(message, duration = 2500) {
  listenToast.textContent = message;
  listenToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => listenToast.classList.remove('show'), duration);
}

function listenLoop() {
  if (!isListening) return;
  const myId = ++loopId;
  const alive = () => isListening && myId === loopId;

  currentIndex = selectListenIndex();
  const word = words[currentIndex];

  // ① 韓国語
  speakWithCallback(word.kr, 'ko-KR', 0.8, () => {
    if (!alive()) return;
    listenTimer = setTimeout(() => {
      if (!alive()) return;
      // ② 日本語
      speakWithCallback(word.jp, 'ja-JP', 1.0, () => {
        if (!alive()) return;
        // ③ 次の単語へ
        listenTimer = setTimeout(() => {
          if (alive()) listenLoop();
        }, PAUSE_AFTER_JAPANESE);
      });
    }, PAUSE_AFTER_KOREAN);
  });
}

// 「覚えた」ボタン：今の単語を除外して次へ
function markCurrentMastered() {
  if (!isListening) return;

  // 進行中の読み上げ・タイマーを無効化
  loopId++;
  clearTimeout(listenTimer);
  window.speechSynthesis.cancel();

  masteredSet.add(words[currentIndex].kr);
  saveMastered();
  updateMasteredDisplay();

  let delay = 400; // cancel直後の読み上げ失敗を避けるための待ち
  if (resetIfAllMastered()) {
    showToast("🎉 全単語を覚えました！リセットします", 3000);
    delay = 3000;
  } else {
    showToast("✅ 覚えた単語に追加しました", 1200);
  }

  listenTimer = setTimeout(() => {
    if (isListening) listenLoop();
  }, delay);
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {
    console.log('WakeLock Fail:', e);
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

function startListening() {
  if (!('speechSynthesis' in window)) {
    alert("お使いのブラウザは音声読み上げに対応していません。");
    return;
  }
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }

  // 念のため、開始時点で全単語チェック済みならリセット
  if (resetIfAllMastered()) {
    alert("全単語を覚えた状態だったため、リセットしました。");
  }

  isListening = true;
  window.speechSynthesis.cancel();
  updateMasteredDisplay();
  listenOverlay.style.display = 'flex';
  requestWakeLock();

  // ユーザー操作の直後に最初の読み上げを開始（iOS対策）
  listenLoop();
}

function stopListening() {
  isListening = false;
  loopId++;
  clearTimeout(listenTimer);
  listenTimer = null;
  window.speechSynthesis.cancel();
  currentUtterance = null;
  listenOverlay.style.display = 'none';
  listenToast.classList.remove('show');
  releaseWakeLock();

  showWord(currentIndex);
  statusDisplay.innerHTML = "🎧 聞き流しモードを停止しました";
}

listenBtn.addEventListener('click', startListening);
masteredBtn.addEventListener('click', markCurrentMastered);
stopListenBtn.addEventListener('click', stopListening);

masteredResetBtn.addEventListener('click', () => {
  if (confirm("覚えた単語の記録をリセットしますか？")) {
    masteredSet.clear();
    saveMastered();
    updateMasteredDisplay();
    statusDisplay.innerHTML = "覚えた単語をリセットしました";
  }
});

document.addEventListener('visibilitychange', () => {
  if (isListening && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});

// ===== 音声認識 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusDisplay.textContent = "お使いのブラウザは音声認識に対応していません。(iOS 14.5以降のSafariをご使用ください)";
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusDisplay.textContent = "🎙️ 聞き取り中... 発音してください";
    micBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    const recognizedText = event.results[0][0].transcript.trim();
    judgePronunciation(recognizedText);
  };

  recognition.onerror = () => {
    statusDisplay.textContent = "❌ 認識エラーが発生しました。もう一度お試しください。";
    micBtn.disabled = false;
  };

  recognition.onend = () => {
    micBtn.disabled = false;
  };
}

// ===== 通常モード =====
function updateWordStatsDisplay(wordKr) {
  const stat = wordStats[wordKr] || { attempts: 0, corrects: 0 };
  if (stat.attempts === 0) {
    statsDisplayDetail.textContent = "📊 成績: 未挑戦";
  } else {
    const rate = Math.round((stat.corrects / stat.attempts) * 100);
    statsDisplayDetail.textContent = `📊 成績: 正解率 ${rate}% (${stat.corrects}/${stat.attempts}回)`;
  }
}

function showWord(index) {
  const word = words[index];

  if (currentMode === 1) {
    wordDisplay.textContent = "❓❓❓";
    meaningDisplay.textContent = word.jp;
  } else {
    wordDisplay.textContent = word.kr;
    meaningDisplay.textContent = "❓❓❓";
  }

  answerBtn.style.display = 'block';
  selfAssessGroup.style.display = 'none';

  updateWordStatsDisplay(word.kr);
  statusDisplay.innerHTML = "「答えを見る」か「発音して判定」を押してください";
}

function selectNextIndex() {
  if (!isWeakOnly) {
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const weakIndices = words.map((w, idx) => {
    const stat = wordStats[w.kr] || { attempts: 0, corrects: 0 };
    const rate = stat.attempts > 0 ? (stat.corrects / stat.attempts) * 100 : 0;
    return { idx, rate, attempts: stat.attempts };
  }).filter(item => item.attempts === 0 || item.rate < 80);

  if (weakIndices.length === 0) {
    statusDisplay.innerHTML = "🎉 すべての苦手単語を克服しました！";
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const candidates = weakIndices.filter(item => item.idx !== currentIndex);
  const targetList = candidates.length > 0 ? candidates : weakIndices;
  const randomChoice = targetList[Math.floor(Math.random() * targetList.length)];
  return randomChoice.idx;
}

answerBtn.addEventListener('click', () => {
  const currentWord = words[currentIndex];
  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'flex';
  statusDisplay.innerHTML = "覚えていましたか？ボタンを押して選択してください";
});

function recordSelfAssessment(isCorrect) {
  const currentWord = words[currentIndex];

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;
  if (isCorrect) {
    wordStats[currentWord.kr].corrects += 1;
  }
  saveStats(wordStats);

  currentIndex = selectNextIndex();
  showWord(currentIndex);
}

function judgePronunciation(userInput) {
  const currentWord = words[currentIndex];
  const targetWord = currentWord.kr.replace(/\s+/g, '');
  const cleanInput = userInput.replace(/\s+/g, '');

  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'none';

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (cleanInput === targetWord) {
    wordStats[currentWord.kr].corrects += 1;
    statusDisplay.innerHTML = `<span class="result-correct">⭕ 発音成功！</span><br>（認識結果: ${userInput}）`;
  } else {
    statusDisplay.innerHTML = `<span class="result-wrong">❌ 惜しい！</span><br>（認識結果: ${userInput}）`;
  }

  saveStats(wordStats);
  updateWordStatsDisplay(currentWord.kr);
}

rememberBtn.addEventListener('click', () => recordSelfAssessment(true));
forgotBtn.addEventListener('click', () => recordSelfAssessment(false));

mode1Btn.addEventListener('click', () => {
  if (currentMode !== 1) {
    currentMode = 1;
    mode1Btn.classList.add('active');
    mode2Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

mode2Btn.addEventListener('click', () => {
  if (currentMode !== 2) {
    currentMode = 2;
    mode2Btn.classList.add('active');
    mode1Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

weakToggleBtn.addEventListener('click', () => {
  isWeakOnly = !isWeakOnly;
  if (isWeakOnly) {
    weakToggleBtn.textContent = "🔥 苦手集中モード: ON";
    weakToggleBtn.classList.add('active');
  } else {
    weakToggleBtn.textContent = "🔥 苦手集中モード: OFF";
    weakToggleBtn.classList.remove('active');
  }
});

audioBtn.addEventListener('click', () => {
  playKoreanAudio(words[currentIndex].kr);
});

micBtn.addEventListener('click', () => {
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
      recognition.start();
    }
  }
});

nextBtn.addEventListener('click', () => {
  currentIndex = selectNextIndex();
  showWord(currentIndex);
});

// 初期描画
currentIndex = Math.floor(Math.random() * words.length);
showWord(currentIndex);
updateMasteredDisplay();

// Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
}
</script>
