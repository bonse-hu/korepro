<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓国語単語・発音チェック</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="韓国語発音">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 5px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #70a1ff;
      background-color: white;
      color: #70a1ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background-color: #70a1ff;
      color: white;
    }
    .weak-toggle-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #ff6b81;
      background-color: white;
      color: #ff6b81;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .weak-toggle-btn.active {
      background-color: #ff6b81;
      color: white;
    }
    .korean-word {
      font-size: 38px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
      min-height: 48px;
      word-break: keep-all;
    }
    .japanese-meaning {
      font-size: 18px;
      color: #7f8c8d;
      margin-bottom: 10px;
      min-height: 25px;
    }
    .word-stats {
      font-size: 13px;
      color: #555;
      background: #f1f2f6;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin: 8px 0;
    }
    .btn-group .btn {
      margin: 0;
      flex: 1;
    }
    .btn-remember { background-color: #2ed573; color: white; }
    .btn-forgot   { background-color: #ff4757; color: white; }
    .btn-answer   { background-color: #ffa502; color: white; }
    .btn-audio    { background-color: #70a1ff; color: white; }
    .btn-mic      { background-color: #5352ed; color: white; }
    .btn-next     { background-color: #2f3542; color: white; }
    .btn-listen   { background-color: #8e44ad; color: white; font-size: 14px; }
    .btn-start    { background-color: #2ed573; color: white; }
    .btn-group-change {
      background-color: white;
      color: #4A90E2;
      border: 2px solid #4A90E2;
      padding: 9px;
      font-size: 14px;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 15px;
      min-height: 50px;
      line-height: 1.4;
    }
    .result-correct {
      color: #2ed573;
      font-weight: bold;
      font-size: 19px;
    }
    .result-wrong {
      color: #ff4757;
      font-weight: bold;
      font-size: 19px;
    }
    /* 覚えた単語の情報表示（通常画面） */
    .mastered-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #555;
      margin: 4px 0 8px;
    }
    .mastered-reset-btn {
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #aaa;
      background: white;
      color: #555;
      border-radius: 8px;
      cursor: pointer;
    }
    .current-groups {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
      word-break: break-all;
    }

    /* ===== グループ選択画面 ===== */
    .group-title {
      font-size: 20px;
      margin: 0 0 15px;
      color: #2c3e50;
    }
    .group-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .group-actions button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #aaa;
      background: white;
      color: #555;
      border-radius: 8px;
      cursor: pointer;
    }
    .group-list {
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .group-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border: 2px solid #e1e5eb;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .group-item.checked {
      border-color: #4A90E2;
      background-color: #eef5fd;
    }
    .group-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      accent-color: #4A90E2;
    }
    .group-name {
      font-weight: bold;
      font-size: 16px;
    }
    .group-count {
      font-size: 12px;
      color: #888;
    }
    .group-selected-info {
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }

    /* ===== 聞き流しモード用の全画面オーバーレイ ===== */
    .listen-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background-color: #000;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .listen-direction {
      color: #666;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .listen-info {
      color: #555;
      font-size: 13px;
      margin-bottom: 15px;
    }
    /* 答えの表示エリア（高さを固定して、表示・非表示でボタン位置が動かないようにする） */
    .listen-answer {
      min-height: 110px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 360px;
      width: 100%;
    }
    .listen-answer.show {
      opacity: 1;
    }
    .listen-answer-kr {
      color: #f0f0f0;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 8px;
      word-break: keep-all;
    }
    .listen-answer-jp {
      color: #aaa;
      font-size: 18px;
    }
    .listen-toast {
      position: absolute;
      top: 10%;
      left: 0;
      width: 100%;
      color: #ddd;
      font-size: 18px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .listen-toast.show {
      opacity: 1;
    }
    .listen-controls {
      width: 100%;
      max-width: 360px;
    }
    .btn-mastered {
      background-color: #1e5631;
      color: #e0e0e0;
      padding: 22px;
      font-size: 18px;
    }
    .btn-stop {
      background-color: #333;
      color: #bbb;
    }
  </style>
</head>
<body>

<!-- ===== グループ選択画面（起動時に表示） ===== -->
<div class="card" id="groupScreen">
  <h2 class="group-title">📂 出題グループを選択</h2>
  <div class="group-actions">
    <button id="selectAllBtn">全て選択</button>
    <button id="clearAllBtn">全て解除</button>
  </div>
  <div class="group-list" id="groupList"></div>
  <div class="group-selected-info" id="groupSelectedInfo"></div>
  <button class="btn btn-start" id="startBtn">▶ スタート</button>
</div>

<!-- ===== メイン画面 ===== -->
<div class="card" id="mainCard" style="display: none;">
  <!-- モード切り替え -->
  <div class="mode-selector">
    <button class="mode-btn active" id="mode1Btn">モード①<br>(日本語➔韓国語)</button>
    <button class="mode-btn" id="mode2Btn">モード②<br>(韓国語➔日本語)</button>
  </div>

  <!-- 苦手集中出題トグル -->
  <button class="weak-toggle-btn" id="weakToggleBtn">🔥 苦手集中モード: OFF</button>

  <div class="current-groups" id="currentGroupsDisplay"></div>

  <div class="korean-word" id="wordDisplay">---</div>
  <div class="japanese-meaning" id="meaningDisplay">---</div>
  <div class="word-stats" id="statsDisplayDetail">📊 成績: 未挑戦</div>

  <!-- 答えを見るボタン -->
  <button class="btn btn-answer" id="answerBtn">💡 答えを見る</button>

  <!-- 答えを見た後に表示される自己判定ボタン -->
  <div class="btn-group" id="selfAssessGroup" style="display: none;">
    <button class="btn btn-remember" id="rememberBtn">⭕ 覚えていた</button>
    <button class="btn btn-forgot" id="forgotBtn">❌ 覚えていなかった</button>
  </div>

  <button class="btn btn-audio" id="audioBtn">🔊 お手本を聞く</button>
  <button class="btn btn-mic" id="micBtn">🎤 発音して判定</button>
  <button class="btn btn-next" id="nextBtn">次へ ➔</button>

  <!-- 聞き流しモード開始ボタン（方向別） -->
  <div class="btn-group">
    <button class="btn btn-listen" id="listenKjBtn">🎧 聞き流し<br>（韓➔日）</button>
    <button class="btn btn-listen" id="listenJkBtn">🎧 聞き流し<br>（日➔韓）</button>
  </div>

  <!-- 覚えた単語の数とリセット -->
  <div class="mastered-info">
    <span id="masteredCountDisplay">✅ 覚えた単語: 0語</span>
    <button class="mastered-reset-btn" id="masteredResetBtn">リセット</button>
  </div>

  <!-- グループ選択に戻る -->
  <button class="btn btn-group-change" id="groupChangeBtn">📂 出題グループを変更</button>

  <div class="status" id="statusDisplay">「答えを見る」か「発音して判定」を押してください</div>
</div>

<!-- 聞き流しモード中の黒画面 -->
<div class="listen-overlay" id="listenOverlay">
  <div class="listen-toast" id="listenToast"></div>
  <div class="listen-direction" id="listenDirectionDisplay"></div>
  <div class="listen-info" id="listenInfo"></div>

  <!-- 答えの表示（2つ目の音声のときだけ表示） -->
  <div class="listen-answer" id="listenAnswer">
    <div class="listen-answer-kr" id="listenAnswerKr"></div>
    <div class="listen-answer-jp" id="listenAnswerJp"></div>
  </div>

  <div class="listen-controls">
    <button class="btn btn-mastered" id="masteredBtn">✅ 覚えた（次回から出さない）</button>
    <button class="btn btn-stop" id="stopListenBtn">⏹ 停止</button>
  </div>
</div>

<!-- 単語データの読み込み（本体スクリプトより前に置く） -->
<script src="words.js"></script>

<script>
// グループ一覧（単語データに登場する順）
const groups = [...new Set(words.map(w => w.group))];

let currentIndex = -1;
let currentMode = 1; // 1: 日本語➔韓国語, 2: 韓国語➔日本語
let isWeakOnly = false;
let recognition = null;
let pendingNotice = null; // 出題時に表示する通知メッセージ

// 聞き流しモード用の状態
let isListening = false;
let listenDirection = 'kj'; // 'kj': 韓国語➔日本語, 'jk': 日本語➔韓国語
let listenTimer = null;
let loopId = 0;
let currentUtterance = null;
let wakeLock = null;
let toastTimer = null;

// ===== 聞き流しモードの設定 =====
// 読み上げ速度
const RATE_KOREAN = 0.8;
const RATE_JAPANESE = 1.0;

// 1つ目の音声のあと、2つ目（答え）までの間（ミリ秒）
const PAUSE_AFTER_FIRST = {
  kj: 1500, // 韓➔日
  jk: 2500  // 日➔韓（韓国語を思い出す時間を長めに）
};
// 2つ目の音声のあと、次の単語までの間（ミリ秒）
const PAUSE_AFTER_SECOND = 2000;

// 読み上げの先頭に付ける余白（先頭欠け対策）。不要なら '' にする
const LEAD_PADDING = { 'ko-KR': '、', 'ja-JP': '、' };

// ===== 保存データ (localStorage) =====
function loadStats() {
  const saved = localStorage.getItem('korean_word_stats');
  return saved ? JSON.parse(saved) : {};
}
function saveStats(stats) {
  localStorage.setItem('korean_word_stats', JSON.stringify(stats));
}

function loadMastered() {
  const saved = localStorage.getItem('korean_mastered_words');
  return new Set(saved ? JSON.parse(saved) : []);
}
function saveMastered() {
  localStorage.setItem('korean_mastered_words', JSON.stringify([...masteredSet]));
}

// 選択中のグループ（初回は全グループ）
function loadSelectedGroups() {
  const saved = localStorage.getItem('korean_selected_groups');
  if (!saved) return new Set(groups);
  const valid = JSON.parse(saved).filter(g => groups.includes(g));
  return new Set(valid.length > 0 ? valid : groups);
}
function saveSelectedGroups() {
  localStorage.setItem('korean_selected_groups', JSON.stringify([...selectedGroups]));
}

let wordStats = loadStats();
let masteredSet = loadMastered();
let selectedGroups = loadSelectedGroups();

// ===== 要素取得 =====
const groupScreen = document.getElementById('groupScreen');
const mainCard = document.getElementById('mainCard');
const groupList = document.getElementById('groupList');
const groupSelectedInfo = document.getElementById('groupSelectedInfo');
const selectAllBtn = document.getElementById('selectAllBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const startBtn = document.getElementById('startBtn');
const groupChangeBtn = document.getElementById('groupChangeBtn');
const currentGroupsDisplay = document.getElementById('currentGroupsDisplay');

const wordDisplay = document.getElementById('wordDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const statsDisplayDetail = document.getElementById('statsDisplayDetail');
const mode1Btn = document.getElementById('mode1Btn');
const mode2Btn = document.getElementById('mode2Btn');
const weakToggleBtn = document.getElementById('weakToggleBtn');
const answerBtn = document.getElementById('answerBtn');
const selfAssessGroup = document.getElementById('selfAssessGroup');
const rememberBtn = document.getElementById('rememberBtn');
const forgotBtn = document.getElementById('forgotBtn');
const audioBtn = document.getElementById('audioBtn');
const micBtn = document.getElementById('micBtn');
const nextBtn = document.getElementById('nextBtn');
const listenKjBtn = document.getElementById('listenKjBtn');
const listenJkBtn = document.getElementById('listenJkBtn');
const listenOverlay = document.getElementById('listenOverlay');
const listenInfo = document.getElementById('listenInfo');
const listenDirectionDisplay = document.getElementById('listenDirectionDisplay');
const listenToast = document.getElementById('listenToast');
const listenAnswer = document.getElementById('listenAnswer');
const listenAnswerKr = document.getElementById('listenAnswerKr');
const listenAnswerJp = document.getElementById('listenAnswerJp');
const masteredBtn = document.getElementById('masteredBtn');
const stopListenBtn = document.getElementById('stopListenBtn');
const masteredCountDisplay = document.getElementById('masteredCountDisplay');
const masteredResetBtn = document.getElementById('masteredResetBtn');
const statusDisplay = document.getElementById('statusDisplay');

// ===== 共通ヘルパー =====

// 選択中グループに含まれる単語のインデックス一覧
function getActiveIndices() {
  return words
    .map((w, idx) => idx)
    .filter(idx => selectedGroups.has(words[idx].group));
}

// 苦手単語の判定（未挑戦 または 正解率80%未満）
function isWeak(word) {
  const stat = wordStats[word.kr] || { attempts: 0, corrects: 0 };
  if (stat.attempts === 0) return true;
  return (stat.corrects / stat.attempts) * 100 < 80;
}

// 候補からランダムに1つ選ぶ（できるだけ直前の単語を避ける）
function pickRandom(pool) {
  if (pool.length === 0) return -1;
  const candidates = pool.filter(idx => idx !== currentIndex);
  const target = candidates.length > 0 ? candidates : pool;
  return target[Math.floor(Math.random() * target.length)];
}

// HTMLエスケープ
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ===== グループ選択画面 =====
function renderGroupList() {
  groupList.innerHTML = '';
  groups.forEach(g => {
    const groupWords = words.filter(w => w.group === g);
    const masteredCount = groupWords.filter(w => masteredSet.has(w.kr)).length;
    const checked = selectedGroups.has(g);

    const label = document.createElement('label');
    label.className = 'group-item' + (checked ? ' checked' : '');
    label.innerHTML = `
      <input type="checkbox" ${checked ? 'checked' : ''}>
      <div>
        <div class="group-name">${escapeHtml(g)}</div>
        <div class="group-count">${groupWords.length}語（覚えた: ${masteredCount}語）</div>
      </div>
    `;
    const checkbox = label.querySelector('input');
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) selectedGroups.add(g);
      else selectedGroups.delete(g);
      label.classList.toggle('checked', checkbox.checked);
      updateGroupSelectedInfo();
    });
    groupList.appendChild(label);
  });
  updateGroupSelectedInfo();
}

function updateGroupSelectedInfo() {
  const count = getActiveIndices().length;
  if (selectedGroups.size === 0) {
    groupSelectedInfo.textContent = "グループを1つ以上選択してください";
    startBtn.disabled = true;
  } else {
    groupSelectedInfo.textContent = `${selectedGroups.size}グループ・${count}語を選択中`;
    startBtn.disabled = false;
  }
}

function showGroupScreen() {
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  renderGroupList();
  mainCard.style.display = 'none';
  groupScreen.style.display = 'block';
}

function startWithSelectedGroups() {
  if (selectedGroups.size === 0) return;
  saveSelectedGroups();

  groupScreen.style.display = 'none';
  mainCard.style.display = 'block';

  const names = groups.filter(g => selectedGroups.has(g));
  currentGroupsDisplay.textContent = `📂 出題範囲: ${names.join(' / ')}（${getActiveIndices().length}語）`;

  currentIndex = -1;
  currentIndex = selectNextIndex();
  showWord(currentIndex);
  updateMasteredDisplay();
}

selectAllBtn.addEventListener('click', () => {
  selectedGroups = new Set(groups);
  renderGroupList();
});
clearAllBtn.addEventListener('click', () => {
  selectedGroups.clear();
  renderGroupList();
});
startBtn.addEventListener('click', startWithSelectedGroups);
groupChangeBtn.addEventListener('click', showGroupScreen);

// ===== 覚えた単語 =====
function updateMasteredDisplay() {
  const active = getActiveIndices();
  const count = active.filter(idx => masteredSet.has(words[idx].kr)).length;
  masteredCountDisplay.textContent = `✅ 覚えた単語: ${count}語 / ${active.length}語`;
  listenInfo.textContent = `残り ${active.length - count}語`;
}

// ===== 音声 =====
function findVoice(lang) {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const prefix = lang.split('-')[0];
  return voices.find(v => v.lang === lang) ||
         voices.find(v => v.lang && v.lang.startsWith(prefix)) ||
         null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function playKoreanAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = RATE_KOREAN;
    const voice = findVoice('ko-KR');
    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("お使いのブラウザは音声読み上げに対応していません。");
  }
}

// 読み上げ終了時にコールバックを呼ぶ（先頭に余白を付けて欠けを防ぐ）
function speakWithCallback(text, lang, rate, onEnd) {
  const padding = LEAD_PADDING[lang] || '';
  const utterance = new SpeechSynthesisUtterance(padding + text);
  utterance.lang = lang;
  utterance.rate = rate;
  const voice = findVoice(lang);
  if (voice) utterance.voice = voice;

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    if (onEnd) onEnd();
  };
  utterance.onend = finish;
  utterance.onerror = finish;

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

// ===== 音声出力の維持（先頭欠け対策） =====
let keepAliveCtx = null;
let keepAliveSource = null;

function startAudioKeepAlive() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!keepAliveCtx) keepAliveCtx = new AC();
    if (keepAliveCtx.state === 'suspended') keepAliveCtx.resume();

    const sr = keepAliveCtx.sampleRate;
    const buffer = keepAliveCtx.createBuffer(1, sr, sr);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.0005;
    }

    keepAliveSource = keepAliveCtx.createBufferSource();
    keepAliveSource.buffer = buffer;
    keepAliveSource.loop = true;
    keepAliveSource.connect(keepAliveCtx.destination);
    keepAliveSource.start();
  } catch (e) {
    console.log('KeepAlive Fail:', e);
  }
}

function stopAudioKeepAlive() {
  if (keepAliveSource) {
    try { keepAliveSource.stop(); } catch (e) {}
    keepAliveSource.disconnect();
    keepAliveSource = null;
  }
  if (keepAliveCtx && keepAliveCtx.state === 'running') {
    keepAliveCtx.suspend();
  }
}

// ===== 聞き流しモード =====

// 答えの表示・非表示
function showListenAnswer(word) {
  listenAnswerKr.textContent = word.kr;
  listenAnswerJp.textContent = word.jp;
  listenAnswer.classList.add('show');
}
function hideListenAnswer() {
  listenAnswer.classList.remove('show');
}

// 聞き流し用の出題選択（選択中グループ内・覚えた単語を除外）
function selectListenIndex() {
  let pool = getActiveIndices().filter(idx => !masteredSet.has(words[idx].kr));

  if (isWeakOnly) {
    const weakPool = pool.filter(idx => isWeak(words[idx]));
    if (weakPool.length > 0) pool = weakPool;
  }
  return pickRandom(pool);
}

// 選択中グループの単語を全部覚えたら、そのグループ分をリセット
function resetIfAllMastered() {
  const active = getActiveIndices();
  const allMastered = active.length > 0 && active.every(idx => masteredSet.has(words[idx].kr));
  if (allMastered) {
    active.forEach(idx => masteredSet.delete(words[idx].kr));
    saveMastered();
    updateMasteredDisplay();
    return true;
  }
  return false;
}

function showToast(message, duration = 2500) {
  listenToast.textContent = message;
  listenToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => listenToast.classList.remove('show'), duration);
}

function listenLoop() {
  if (!isListening) return;
  const myId = ++loopId;
  const alive = () => isListening && myId === loopId;

  const nextIdx = selectListenIndex();
  if (nextIdx < 0) {
    resetIfAllMastered();
    listenTimer = setTimeout(() => { if (alive()) listenLoop(); }, 500);
    return;
  }
  currentIndex = nextIdx;
  const word = words[currentIndex];

  // 方向に応じて、1つ目（問題）と2つ目（答え）の音声を決める
  const korean   = { text: word.kr, lang: 'ko-KR', rate: RATE_KOREAN };
  const japanese = { text: word.jp, lang: 'ja-JP', rate: RATE_JAPANESE };
  const first  = listenDirection === 'kj' ? korean : japanese;
  const second = listenDirection === 'kj' ? japanese : korean;

  // 新しい単語の開始時は答えを隠す
  hideListenAnswer();

  // ① 問題の音声
  speakWithCallback(first.text, first.lang, first.rate, () => {
    if (!alive()) return;
    listenTimer = setTimeout(() => {
      if (!alive()) return;
      // ② 答えを画面に表示して、答えの音声
      showListenAnswer(word);
      speakWithCallback(second.text, second.lang, second.rate, () => {
        if (!alive()) return;
        // ③ 次の単語へ
        listenTimer = setTimeout(() => {
          if (alive()) listenLoop();
        }, PAUSE_AFTER_SECOND);
      });
    }, PAUSE_AFTER_FIRST[listenDirection]);
  });
}

function markCurrentMastered() {
  if (!isListening || currentIndex < 0) return;

  loopId++;
  clearTimeout(listenTimer);
  window.speechSynthesis.cancel();
  hideListenAnswer();

  masteredSet.add(words[currentIndex].kr);
  saveMastered();
  updateMasteredDisplay();

  let delay = 400;
  if (resetIfAllMastered()) {
    showToast("🎉 選択中の単語を全て覚えました！リセットします", 3000);
    delay = 3000;
  } else {
    showToast("✅ 覚えた単語に追加しました", 1200);
  }

  listenTimer = setTimeout(() => {
    if (isListening) listenLoop();
  }, delay);
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {
    console.log('WakeLock Fail:', e);
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

// direction: 'kj'（韓➔日） または 'jk'（日➔韓）
function startListening(direction) {
  if (!('speechSynthesis' in window)) {
    alert("お使いのブラウザは音声読み上げに対応していません。");
    return;
  }
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }

  if (resetIfAllMastered()) {
    alert("選択中の単語が全て「覚えた」状態だったため、リセットしました。");
  }

  listenDirection = direction;
  listenDirectionDisplay.textContent =
    direction === 'kj' ? "🎧 韓国語 ➔ 日本語" : "🎧 日本語 ➔ 韓国語";

  isListening = true;
  window.speechSynthesis.cancel();
  hideListenAnswer();
  updateMasteredDisplay();
  listenOverlay.style.display = 'flex';
  requestWakeLock();

  // ボタンを押した直後に開始する必要がある（iOS対策）
  startAudioKeepAlive();

  // 無音のウォームアップで音声エンジンを準備
  const warmUp = new SpeechSynthesisUtterance('、');
  warmUp.lang = 'ja-JP';
  warmUp.volume = 0;
  window.speechSynthesis.speak(warmUp);

  // 少し待ってから最初の単語へ
  const myId = ++loopId;
  listenTimer = setTimeout(() => {
    if (isListening && myId === loopId) listenLoop();
  }, 600);
}

function stopListening() {
  isListening = false;
  loopId++;
  clearTimeout(listenTimer);
  listenTimer = null;
  window.speechSynthesis.cancel();
  currentUtterance = null;
  hideListenAnswer();
  listenOverlay.style.display = 'none';
  listenToast.classList.remove('show');
  releaseWakeLock();
  stopAudioKeepAlive();

  if (currentIndex >= 0) showWord(currentIndex);
  statusDisplay.innerHTML = "🎧 聞き流しモードを停止しました";
}

listenKjBtn.addEventListener('click', () => startListening('kj'));
listenJkBtn.addEventListener('click', () => startListening('jk'));
masteredBtn.addEventListener('click', markCurrentMastered);
stopListenBtn.addEventListener('click', stopListening);

masteredResetBtn.addEventListener('click', () => {
  if (confirm("選択中グループの「覚えた単語」の記録をリセットしますか？")) {
    getActiveIndices().forEach(idx => masteredSet.delete(words[idx].kr));
    saveMastered();
    updateMasteredDisplay();
    statusDisplay.innerHTML = "覚えた単語をリセットしました";
  }
});

document.addEventListener('visibilitychange', () => {
  if (isListening && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});

// ===== 音声認識 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusDisplay.textContent = "お使いのブラウザは音声認識に対応していません。(iOS 14.5以降のSafariをご使用ください)";
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusDisplay.textContent = "🎙️ 聞き取り中... 発音してください";
    micBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    const recognizedText = event.results[0][0].transcript.trim();
    judgePronunciation(recognizedText);
  };

  recognition.onerror = () => {
    statusDisplay.textContent = "❌ 認識エラーが発生しました。もう一度お試しください。";
    micBtn.disabled = false;
  };

  recognition.onend = () => {
    micBtn.disabled = false;
  };
}

// ===== 通常モード =====
function updateWordStatsDisplay(wordKr) {
  const stat = wordStats[wordKr] || { attempts: 0, corrects: 0 };
  if (stat.attempts === 0) {
    statsDisplayDetail.textContent = "📊 成績: 未挑戦";
  } else {
    const rate = Math.round((stat.corrects / stat.attempts) * 100);
    statsDisplayDetail.textContent = `📊 成績: 正解率 ${rate}% (${stat.corrects}/${stat.attempts}回)`;
  }
}

function showWord(index) {
  if (index < 0) return;
  const word = words[index];

  if (currentMode === 1) {
    wordDisplay.textContent = "❓❓❓";
    meaningDisplay.textContent = word.jp;
  } else {
    wordDisplay.textContent = word.kr;
    meaningDisplay.textContent = "❓❓❓";
  }

  answerBtn.style.display = 'block';
  selfAssessGroup.style.display = 'none';

  updateWordStatsDisplay(word.kr);
  statusDisplay.innerHTML = pendingNotice || "「答えを見る」か「発音して判定」を押してください";
  pendingNotice = null;
}

// 通常モードの出題選択（選択中グループ内から）
function selectNextIndex() {
  const active = getActiveIndices();
  let pool = active;

  if (isWeakOnly) {
    const weakPool = active.filter(idx => isWeak(words[idx]));
    if (weakPool.length === 0) {
      pendingNotice = "🎉 選択中グループの苦手単語をすべて克服しました！";
    } else {
      pool = weakPool;
    }
  }
  return pickRandom(pool);
}

answerBtn.addEventListener('click', () => {
  const currentWord = words[currentIndex];
  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'flex';
  statusDisplay.innerHTML = "覚えていましたか？ボタンを押して選択してください";
});

function recordSelfAssessment(isCorrect) {
  const currentWord = words[currentIndex];

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;
  if (isCorrect) {
    wordStats[currentWord.kr].corrects += 1;
  }
  saveStats(wordStats);

  currentIndex = selectNextIndex();
  showWord(currentIndex);
}

function judgePronunciation(userInput) {
  const currentWord = words[currentIndex];
  const targetWord = currentWord.kr.replace(/\s+/g, '');
  const cleanInput = userInput.replace(/\s+/g, '');

  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'none';

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (cleanInput === targetWord) {
    wordStats[currentWord.kr].corrects += 1;
    statusDisplay.innerHTML = `<span class="result-correct">⭕ 発音成功！</span><br>（認識結果: ${escapeHtml(userInput)}）`;
  } else {
    statusDisplay.innerHTML = `<span class="result-wrong">❌ 惜しい！</span><br>（認識結果: ${escapeHtml(userInput)}）`;
  }

  saveStats(wordStats);
  updateWordStatsDisplay(currentWord.kr);
}

rememberBtn.addEventListener('click', () => recordSelfAssessment(true));
forgotBtn.addEventListener('click', () => recordSelfAssessment(false));

mode1Btn.addEventListener('click', () => {
  if (currentMode !== 1) {
    currentMode = 1;
    mode1Btn.classList.add('active');
    mode2Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

mode2Btn.addEventListener('click', () => {
  if (currentMode !== 2) {
    currentMode = 2;
    mode2Btn.classList.add('active');
    mode1Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

weakToggleBtn.addEventListener('click', () => {
  isWeakOnly = !isWeakOnly;
  if (isWeakOnly) {
    weakToggleBtn.textContent = "🔥 苦手集中モード: ON";
    weakToggleBtn.classList.add('active');
  } else {
    weakToggleBtn.textContent = "🔥 苦手集中モード: OFF";
    weakToggleBtn.classList.remove('active');
  }
});

audioBtn.addEventListener('click', () => {
  if (currentIndex >= 0) playKoreanAudio(words[currentIndex].kr);
});

micBtn.addEventListener('click', () => {
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
      recognition.start();
    }
  }
});

nextBtn.addEventListener('click', () => {
  currentIndex = selectNextIndex();
  showWord(currentIndex);
});

// ===== 起動時：グループ選択画面を表示 =====
showGroupScreen();

// Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
}
</script>
