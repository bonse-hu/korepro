<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓国語単語・発音チェック</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="韓国語発音">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 5px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #70a1ff;
      background-color: white;
      color: #70a1ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background-color: #70a1ff;
      color: white;
    }
    .weak-toggle-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #ff6b81;
      background-color: white;
      color: #ff6b81;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .weak-toggle-btn.active {
      background-color: #ff6b81;
      color: white;
    }
    .korean-word {
      font-size: 38px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
      min-height: 48px;
      word-break: keep-all;
    }
    .japanese-meaning {
      font-size: 18px;
      color: #7f8c8d;
      margin-bottom: 10px;
      min-height: 25px;
    }
    .word-stats {
      font-size: 13px;
      color: #555;
      background: #f1f2f6;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin: 8px 0;
    }
    .btn-group .btn {
      margin: 0;
      flex: 1;
    }
    .btn-remember {
      background-color: #2ed573;
      color: white;
    }
    .btn-forgot {
      background-color: #ff4757;
      color: white;
    }
    .btn-answer {
      background-color: #ffa502;
      color: white;
    }
    .btn-audio {
      background-color: #70a1ff;
      color: white;
    }
    .btn-mic {
      background-color: #5352ed;
      color: white;
    }
    .btn-next {
      background-color: #2f3542;
      color: white;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 15px;
      min-height: 50px;
      line-height: 1.4;
    }
    .result-correct {
      color: #2ed573;
      font-weight: bold;
      font-size: 19px;
    }
    .result-wrong {
      color: #ff4757;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- モード切り替え -->
  <div class="mode-selector">
    <button class="mode-btn active" id="mode1Btn">モード①<br>(日本語➔韓国語)</button>
    <button class="mode-btn" id="mode2Btn">モード②<br>(韓国語➔日本語)</button>
  </div>

  <!-- 苦手集中出題トグル -->
  <button class="weak-toggle-btn" id="weakToggleBtn">🔥 苦手集中モード: OFF</button>

  <div class="korean-word" id="wordDisplay">---</div>
  <div class="japanese-meaning" id="meaningDisplay">---</div>
  <div class="word-stats" id="statsDisplayDetail">📊 成績: 未挑戦</div>

  <!-- 答えを見るボタン -->
  <button class="btn btn-answer" id="answerBtn">💡 答えを見る</button>

  <!-- 答えを見た後に表示される自己判定ボタン -->
  <div class="btn-group" id="selfAssessGroup" style="display: none;">
    <button class="btn btn-remember" id="rememberBtn">⭕ 覚えていた</button>
    <button class="btn btn-forgot" id="forgotBtn">❌ 覚えていなかった</button>
  </div>

  <button class="btn btn-audio" id="audioBtn">🔊 お手本を聞く</button>
  <button class="btn btn-mic" id="micBtn">🎤 発音して判定</button>
  <button class="btn btn-next" id="nextBtn">次へ ➔</button>

  <div class="status" id="statusDisplay">「答えを見る」か「発音して判定」を押してください</div>
</div>

<script>
// 単語データ
const words = [
  { kr: "가게", jp: "店" },
  { kr: "가격", jp: "価格" },
  { kr: "가구", jp: "家具" },
  { kr: "가깝다", jp: "近い" },
  { kr: "가끔", jp: "時々" },
  { kr: "가다", jp: "行く" },
  { kr: "가르치다", jp: "教える" },
  { kr: "가방", jp: "鞄" },
  { kr: "가볍다", jp: "軽い" },
  { kr: "가수", jp: "歌手" },
  { kr: "가슴", jp: "胸" },
  { kr: "가요", jp: "歌謡" },
  { kr: "가운데", jp: "間、中間" },
  { kr: "가위", jp: "はさみ" },
  { kr: "가을", jp: "秋" },
  { kr: "가장", jp: "最も、一番" },
  { kr: "가져가다", jp: "持って行く" },
  { kr: "가져오다", jp: "持って来る" },
  { kr: "가족", jp: "家族" },
  { kr: "가지", jp: "種類" },
  { kr: "가지다", jp: "持つ" },
  { kr: "각", jp: "各、おのおの" },
  { kr: "간", jp: "間" },
  { kr: "간단하다", jp: "簡単だ" },
  { kr: "간단히", jp: "簡単に" },
  { kr: "간식", jp: "間食、おやつ" },
  { kr: "간장", jp: "醤油" },
  { kr: "간호사", jp: "看護士" },
  { kr: "갈비", jp: "カルビ" },
  { kr: "갈비탕", jp: "カルビタン" },
  { kr: "갈색", jp: "褐色、茶色" },
  { kr: "갈아타다", jp: "乗り換える" },
  { kr: "감", jp: "柿" },
  { kr: "감기", jp: "風邪" },
  { kr: "감기약", jp: "風邪薬" },
  { kr: "감다", jp: "（目を）閉じる" },
  { kr: "감동", jp: "感動" },
  { kr: "감동하다", jp: "感動する" },
  { kr: "감사", jp: "感謝" },
  { kr: "감사드립니다", jp: "ありがとうございます" },
  { kr: "감사하다", jp: "感謝する" },
  { kr: "감사합니다", jp: "ありがとうございます" },
  { kr: "감자", jp: "じゃがいも" },
  { kr: "감자탕", jp: "カムジャタン" },
  { kr: "갑자기", jp: "急に" },
  { kr: "값", jp: "値段、価値" },
  { kr: "강", jp: "川" },
  { kr: "강아지", jp: "子犬" },
  { kr: "강좌", jp: "講座" },
  { kr: "갖다", jp: "持つ" },
  { kr: "같다", jp: "同じだ" },
  { kr: "같이", jp: "一緒に" },
  { kr: "개", jp: "～個、犬" },
  { kr: "개나리", jp: "レンギョウ" },
  { kr: "개인", jp: "個人" },
  { kr: "거기", jp: "そこ" },
  { kr: "거리", jp: "通り、街" },
  { kr: "거실", jp: "居室、居間" },
  { kr: "거울", jp: "鏡" },
  { kr: "거의", jp: "ほとんど" },
  { kr: "거짓말", jp: "嘘" },
  { kr: "걱정", jp: "心配" },
  { kr: "걱정하다", jp: "心配する" },
  { kr: "건강", jp: "健康" },
  { kr: "건강하다", jp: "健康だ" },
  { kr: "건너가다", jp: "渡って行く、渡る、横切る" },
  { kr: "건너다", jp: "渡る" },
  { kr: "건너편", jp: "向こう側、向かい" },
  { kr: "건물", jp: "建物" },
  { kr: "건배", jp: "乾杯" },
  { kr: "걷다", jp: "歩く" },
  { kr: "걸다", jp: "かける" },
  { kr: "걸리다", jp: "かかる" },
  { kr: "걸어가다", jp: "歩いて行く" },
  { kr: "걸어오다", jp: "歩いて来る" },
  { kr: "검은색", jp: "黒、黒色" },
  { kr: "것", jp: "もの、こと" },
  { kr: "게임", jp: "ゲーム、遊び" },
  { kr: "겨울", jp: "冬" },
  { kr: "겨울방학", jp: "冬休み" },
  { kr: "결과", jp: "結果" },
  { kr: "결정", jp: "決定" },
  { kr: "결정하다", jp: "決定する" },
  { kr: "결혼", jp: "結婚" },
  { kr: "결혼식", jp: "結婚式" },
  { kr: "결혼하다", jp: "結婚する" },
  { kr: "경기", jp: "競技、試合" },
  { kr: "경기장", jp: "競技場" },
  { kr: "경복궁", jp: "景福宮" },
  { kr: "경주", jp: "慶州" },
  { kr: "경찰", jp: "警察" },
  { kr: "경찰관", jp: "警察官" },
  { kr: "경찰서", jp: "警察署" },
  { kr: "경치", jp: "景色、風景" },
  { kr: "경험", jp: "経験" },
  { kr: "계단", jp: "階段" },
  { kr: "계란", jp: "鶏卵、たまご" },
  { kr: "계산하다", jp: "計算する" },
  { kr: "계속", jp: "続けて" }
];

let currentIndex = 0;
let currentMode = 1; // 1: 日本語➔韓国語, 2: 韓国語➔日本語
let isWeakOnly = false;
let recognition = null;

// 成績データの読み込み・保存 (localStorage)
function loadStats() {
  const saved = localStorage.getItem('korean_word_stats');
  return saved ? JSON.parse(saved) : {};
}

function saveStats(stats) {
  localStorage.setItem('korean_word_stats', JSON.stringify(stats));
}

let wordStats = loadStats();

const wordDisplay = document.getElementById('wordDisplay');
const meaningDisplay = document.getElementById('meaningDisplay');
const statsDisplayDetail = document.getElementById('statsDisplayDetail');
const mode1Btn = document.getElementById('mode1Btn');
const mode2Btn = document.getElementById('mode2Btn');
const weakToggleBtn = document.getElementById('weakToggleBtn');
const answerBtn = document.getElementById('answerBtn');
const selfAssessGroup = document.getElementById('selfAssessGroup');
const rememberBtn = document.getElementById('rememberBtn');
const forgotBtn = document.getElementById('forgotBtn');
const audioBtn = document.getElementById('audioBtn');
const micBtn = document.getElementById('micBtn');
const nextBtn = document.getElementById('nextBtn');
const statusDisplay = document.getElementById('statusDisplay');

// 音声再生機能
function playKoreanAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  } else {
    alert("お使いのブラウザは音声読み上げに対応していません。");
  }
}

// 音声認識の初期化
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusDisplay.textContent = "お使いのブラウザは音声認識に対応していません。(iOS 14.5以降のSafariをご使用ください)";
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusDisplay.textContent = "🎙️ 聞き取り中... 発音してください";
    micBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    const recognizedText = event.results.transcript.trim();
    judgePronunciation(recognizedText);
  };

  recognition.onerror = () => {
    statusDisplay.textContent = "❌ 認識エラーが発生しました。もう一度お試しください。";
    micBtn.disabled = false;
  };

  recognition.onend = () => {
    micBtn.disabled = false;
  };
}

// 成績表示更新
function updateWordStatsDisplay(wordKr) {
  const stat = wordStats[wordKr] || { attempts: 0, corrects: 0 };
  if (stat.attempts === 0) {
    statsDisplayDetail.textContent = "📊 成績: 未挑戦";
  } else {
    const rate = Math.round((stat.corrects / stat.attempts) * 100);
    statsDisplayDetail.textContent = `📊 成績: 正解率 ${rate}% (${stat.corrects}/${stat.attempts}回)`;
  }
}

// 単語表示の更新（出題時の初期化）
function showWord(index) {
  const word = words[index];

  if (currentMode === 1) {
    wordDisplay.textContent = "❓❓❓";
    meaningDisplay.textContent = word.jp;
  } else {
    wordDisplay.textContent = word.kr;
    meaningDisplay.textContent = "❓❓❓";
  }

  // ボタン表示状態のリセット
  answerBtn.style.display = 'block';
  selfAssessGroup.style.display = 'none';

  updateWordStatsDisplay(word.kr);
  statusDisplay.innerHTML = "「答えを見る」か「発音して判定」を押してください";
}

// 次の単語インデックスをランダム選出
function selectNextIndex() {
  if (!isWeakOnly) {
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const weakIndices = words.map((w, idx) => {
    const stat = wordStats[w.kr] || { attempts: 0, corrects: 0 };
    const rate = stat.attempts > 0 ? (stat.corrects / stat.attempts) * 100 : 0;
    return { idx, rate, attempts: stat.attempts };
  }).filter(item => item.attempts === 0 || item.rate < 80);

  if (weakIndices.length === 0) {
    statusDisplay.innerHTML = "🎉 すべての苦手単語を克服しました！";
    if (words.length <= 1) return 0;
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * words.length);
    } while (nextIdx === currentIndex);
    return nextIdx;
  }

  const candidates = weakIndices.filter(item => item.idx !== currentIndex);
  const targetList = candidates.length > 0 ? candidates : weakIndices;
  const randomChoice = targetList[Math.floor(Math.random() * targetList.length)];
  return randomChoice.idx;
}

// 「答えを見る」処理
answerBtn.addEventListener('click', () => {
  const currentWord = words[currentIndex];
  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'flex';
  statusDisplay.innerHTML = "覚えていましたか？ボタンを押して選択してください";
});

// 自己判定処理（覚えていた / 覚えていなかった）➔ 成績記録後にすぐ次の出題へ
function recordSelfAssessment(isCorrect) {
  const currentWord = words[currentIndex];

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (isCorrect) {
    wordStats[currentWord.kr].corrects += 1;
  }

  saveStats(wordStats);

  // 即座に次の単語へ移動
  currentIndex = selectNextIndex();
  showWord(currentIndex);
}

// 音声判定処理
function judgePronunciation(userInput) {
  const currentWord = words[currentIndex];
  const targetWord = currentWord.kr.replace(/\s+/g, '');
  const cleanInput = userInput.replace(/\s+/g, '');

  wordDisplay.textContent = currentWord.kr;
  meaningDisplay.textContent = currentWord.jp;

  answerBtn.style.display = 'none';
  selfAssessGroup.style.display = 'none';

  if (!wordStats[currentWord.kr]) {
    wordStats[currentWord.kr] = { attempts: 0, corrects: 0 };
  }
  wordStats[currentWord.kr].attempts += 1;

  if (cleanInput === targetWord) {
    wordStats[currentWord.kr].corrects += 1;
    statusDisplay.innerHTML = `<span class="result-correct">⭕ 発音成功！</span><br>（認識結果: ${userInput}）`;
  } else {
    statusDisplay.innerHTML = `<span class="result-wrong">❌ 惜しい！</span><br>（認識結果: ${userInput}）`;
  }

  saveStats(wordStats);
  updateWordStatsDisplay(currentWord.kr);
}

// イベント設定
rememberBtn.addEventListener('click', () => recordSelfAssessment(true));
forgotBtn.addEventListener('click', () => recordSelfAssessment(false));

mode1Btn.addEventListener('click', () => {
  if (currentMode !== 1) {
    currentMode = 1;
    mode1Btn.classList.add('active');
    mode2Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

mode2Btn.addEventListener('click', () => {
  if (currentMode !== 2) {
    currentMode = 2;
    mode2Btn.classList.add('active');
    mode1Btn.classList.remove('active');
    showWord(currentIndex);
  }
});

weakToggleBtn.addEventListener('click', () => {
  isWeakOnly = !isWeakOnly;
  if (isWeakOnly) {
    weakToggleBtn.textContent = "🔥 苦手集中モード: ON";
    weakToggleBtn.classList.add('active');
  } else {
    weakToggleBtn.textContent = "🔥 苦手集中モード: OFF";
    weakToggleBtn.classList.remove('active');
  }
});

audioBtn.addEventListener('click', () => {
  playKoreanAudio(words[currentIndex].kr);
});

micBtn.addEventListener('click', () => {
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      recognition.stop();
      recognition.start();
    }
  }
});

nextBtn.addEventListener('click', () => {
  currentIndex = selectNextIndex();
  showWord(currentIndex);
});

// 初期描画
currentIndex = Math.floor(Math.random() * words.length);
showWord(currentIndex);

// Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
}
</script>
</body>
</html>
